<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Page</title>

    <link th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css}" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:insert="~{fragments/general::header}"></div>

<main class="container py-2 d-flex flex-column gap-4">

    <!-- Page Heading -->
    <div class="mb-2">

        <div class="d-flex align-items-center justify-content-between">

            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-bar-chart-fill text-primary fs-1"></i>
                <h2 class="fw-bold mb-0" th:text="#{dashboard.title}">Dashboard</h2>
            </div>

            <div>
                <select name="date" class="form-select" id="days">
                    <option value="30" th:text="#{dashboard.date.last30}">Last 30 days</option>
                    <option value="7" th:text="#{dashboard.date.last7}">Last 7 days</option>
                </select>
            </div>

        </div>

        <p class="text-muted mb-0 fw-semibold"
           th:text="#{dashboard.subtitle}">
            Overview of the JobCenter platform
        </p>

    </div>


    <!-- Statistics -->
    <div class="row g-3">

        <!-- Total Vacancies -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex align-items-center gap-3">

                    <div class="page-icon bg-primary">
                        <i class="bi bi-briefcase-fill text-white"></i>
                    </div>

                    <div>
                        <h6 class="text-muted mb-1" th:text="#{dashboard.stats.vacancies}">Total Vacancies</h6>
                        <h3 class="fw-bold mb-0" th:text="${totalVacancies}">0</h3>
                    </div>

                </div>
            </div>
        </div>

        <!-- Total Users -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex align-items-center gap-3">

                    <div class="page-icon bg-primary">
                        <i class="bi bi-people-fill text-white"></i>
                    </div>

                    <div>
                        <h6 class="text-muted mb-1" th:text="#{dashboard.stats.users}">Total Users</h6>
                        <h3 class="fw-bold mb-0" th:text="${totalUsers}">0</h3>
                    </div>

                </div>
            </div>
        </div>

        <!-- Total Companies -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex align-items-center gap-3">

                    <div class="page-icon bg-success">
                        <i class="bi bi-building-fill text-white"></i>
                    </div>

                    <div>
                        <h6 class="text-muted mb-1" th:text="#{dashboard.stats.companies}">Total Companies</h6>
                        <h3 class="fw-bold mb-0" th:text="${totalCompanies}">0</h3>
                    </div>

                </div>
            </div>
        </div>

        <!-- Total Applications -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex align-items-center gap-3">

                    <div class="page-icon bg-warning">
                        <i class="bi bi-person-badge-fill text-white"></i>
                    </div>

                    <div>
                        <h6 class="text-muted mb-1" th:text="#{dashboard.stats.applications}">Total Applications</h6>
                        <h3 class="fw-bold mb-0" th:text="${totalApplications}">0</h3>
                    </div>

                </div>
            </div>
        </div>

    </div>


    <!-- Charts -->
    <div class="row g-3">

        <!-- Vacancies Growth -->
        <div class="col-12 col-lg-8">
            <div class="card h-100 shadow-sm border-0">

                <div class="card-body">

                    <h5 class="fw-bold mb-3">
                        <i class="bi bi-graph-up-arrow text-primary me-2"></i>
                        <span th:text="#{dashboard.chart.vacanciesGrowth}">Vacancies Growth</span>
                    </h5>

                    <canvas id="vacanciesChart"></canvas>

                </div>

            </div>
        </div>

        <!-- Vacancy Types -->
        <div class="col-12 col-lg-4">
            <div class="card h-100 shadow-sm border-0">

                <div class="card-body ">

                    <h5 class="fw-bold mb-3">
                        <i class="bi bi-pie-chart-fill text-primary me-2"></i>
                        <span th:text="#{dashboard.chart.vacancyTypes}">Vacancy Types</span>
                    </h5>

                    <canvas id="vacancyTypes"></canvas>

                </div>

            </div>
        </div>

    </div>


    <!-- Latest Vacancies and Recent Users -->
    <div class="row g-3">

        <!-- Latest Vacancies -->
        <div class="col-12 col-lg-6">
            <div class="card h-100 shadow-sm border-0">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-briefcase-fill me-2"></i>
                            <span th:text="#{dashboard.latestVacancies}">Latest Vacancies</span>
                        </h5>

                        <a th:href="@{/vacancies}" class="text-decoration-none fw-semibold">
                            <span th:text="#{dashboard.viewAll}">View All</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light">
                                <tr>
                                    <th th:text="#{dashboard.table.title}">Title</th>
                                    <th th:text="#{dashboard.table.company}">Company</th>
                                    <th th:text="#{dashboard.table.salary}">Salary</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="vacancy : ${vacancies}">
                                    <td th:text="${vacancy.title}"></td>
                                    <td th:text="${vacancy.company.name}"></td>
                                    <td th:text="${vacancy.salary}"></td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>
        </div>


        <!-- Recent Users -->
        <div class="col-12 col-lg-6">
            <div class="card h-100 shadow-sm border-0">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="fw-bold mb-0">
                            <i class="bi bi-people-fill me-2"></i>
                            <span th:text="#{dashboard.recentUsers}">Recent Users</span>
                        </h5>

                        <a th:href="@{/users}" class="text-decoration-none fw-semibold">
                            <span th:text="#{dashboard.viewAll}">View All</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light">
                                <tr>
                                    <th th:text="#{dashboard.table.name}">Name</th>
                                    <th th:text="#{dashboard.table.email}">Email</th>
                                    <th th:text="#{dashboard.table.role}">Role</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.firstName}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td>
                                        <span th:each="role : ${user.roles}"
                                              class="badge bg-primary-subtle text-primary me-1"
                                              th:text="${role.name}">
                                        </span>
                                    </td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>
        </div>

    </div>

</main>


<div th:insert="~{fragments/general::footer}"></div>

<script th:src="@{/webjars/chart.js/4.6.1/dist/chart.umd.js}"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
